<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arogya Seva">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Arogya Seva</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    let activeRecognition = null;

    window.isSpeechRecognitionAvailable = function() {
      return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    };

    window.startSpeechRecognition = function(lang) {
      return new Promise((resolve, reject) => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          reject('Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.');
          return;
        }

        if (activeRecognition) {
          try { activeRecognition.abort(); } catch(e) {}
        }

        const recognition = new SpeechRec();
        activeRecognition = recognition;
        recognition.lang = lang || 'en-IN';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        let finalResult = '';

        recognition.onresult = (event) => {
          if (event.results && event.results.length > 0) {
            finalResult = event.results[0][0].transcript;
          }
        };

        recognition.onerror = (event) => {
          activeRecognition = null;
          console.warn('Speech recognition error:', event.error);
          if (event.error === 'not-allowed') {
            reject('Microphone permission denied. Please enable microphone access in your browser settings.');
          } else if (event.error === 'no-speech') {
            resolve('');
          } else {
            reject('Voice recognition error: ' + event.error);
          }
        };

        recognition.onend = () => {
          activeRecognition = null;
          resolve(finalResult);
        };

        try {
          recognition.start();
        } catch(err) {
          activeRecognition = null;
          reject(err.toString());
        }
      });
    };

    window.stopSpeechRecognition = function() {
      if (activeRecognition) {
        try {
          activeRecognition.stop();
        } catch(e) {}
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
